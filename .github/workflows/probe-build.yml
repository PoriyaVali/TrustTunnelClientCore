name: probe-build

# Work out what it takes to build the client core, on a runner that can reach
# the package index.
#
# conancenter answers 403 from our own network, so a local build cannot resolve
# even brotli - a network fact rather than anything about this project. The same
# was true of the endpoint: Windows could not compile it, and CI became the
# compiler.
#
# The target is a parameter. Android is what the app needs first, but the client
# supports Windows too and none of this should have to be rewritten to get
# there - only a profile added below.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which platform to resolve for'
        type: choice
        options: [android-arm64, android-arm32, windows-x64, linux-x64]
        default: android-arm64
      client_ref:
        description: 'Ref of PoriyaVali/TrustTunnelClient'
        default: 'master'
      drop_dns_libs:
        description: 'Remove dns-libs (never constructed in our config)'
        type: boolean
        default: true

jobs:
  probe:
    runs-on: ${{ inputs.target == 'windows-x64' && 'windows-latest' || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the client
        uses: actions/checkout@v4
        with:
          repository: PoriyaVali/TrustTunnelClient
          ref: ${{ inputs.client_ref }}
          path: client

      - name: Tools
        run: |
          python3 -m pip install --quiet "conan>=2.0"
          conan --version
          conan profile detect --force

      # Upstream publishes its conan profiles - including the cross-compilation
      # toolchains - as a plain release asset, so none of this has to be written.
      - name: AdGuard's conan profiles
        run: |
          curl -sL -o /tmp/conanfiles.tar.gz \
            https://github.com/AdguardTeam/NativeLibsCommon/releases/latest/download/conanfiles.tar.gz
          mkdir -p /tmp/cf && tar -xzf /tmp/conanfiles.tar.gz -C /tmp/cf
          CH="$(conan config home)"
          cp /tmp/cf/profiles/* "$CH/profiles/"
          cp /tmp/cf/settings_user.yml "$CH/" 2>/dev/null || true
          ls "$CH/profiles" | tr '\n' ' '; echo

      # One case per target. Adding a platform later means adding a case here,
      # and nothing else.
      - name: Profile for ${{ inputs.target }}
        run: |
          CH="$(conan config home)"
          case "${{ inputs.target }}" in
            android-arm64|android-arm32)
              if [ "${{ inputs.target }}" = "android-arm64" ]; then a=armv8; else a=armv7; fi
              cat > "$CH/profiles/target" <<EOF
          include(android.jinja)
          [settings]
          os=Android
          os.api_level=26
          arch=$a
          compiler=clang
          compiler.version=18
          compiler.libcxx=c++_static
          compiler.cppstd=20
          build_type=Release
          [conf]
          tools.android:ndk_path=${ANDROID_NDK_LATEST_HOME}
          EOF
              ;;
            windows-x64)
              cat > "$CH/profiles/target" <<'EOF'
          include(windows-msvc.jinja)
          [settings]
          os=Windows
          arch=x86_64
          compiler=msvc
          compiler.version=194
          compiler.runtime=static
          compiler.cppstd=20
          build_type=Release
          EOF
              ;;
            linux-x64)
              cat > "$CH/profiles/target" <<'EOF'
          include(linux.jinja)
          [settings]
          os=Linux
          arch=x86_64
          compiler=gcc
          compiler.version=13
          compiler.libcxx=libstdc++11
          compiler.cppstd=20
          build_type=Release
          EOF
              ;;
          esac
          conan profile show -pr target | head -18

      # In our configuration the DNS proxy is never constructed: dns_handler
      # returns early when dns_upstreams is empty, and Irboard does not emit
      # deep-link tag 0x0D. Dropping the heaviest dependency changes size, not
      # behaviour.
      - name: Drop dns-libs
        if: ${{ inputs.drop_dns_libs }}
        working-directory: client
        run: |
          python3 - <<'PY'
          import io
          p = "conanfile.py"
          out = []
          for line in io.open(p, encoding="utf-8").read().split("\n"):
              if "dns-libs" in line and "self.requires" in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  out.append(indent + "pass  # dropped: never constructed in our config")
              else:
                  out.append(line)
          io.open(p, "w", encoding="utf-8", newline="").write("\n".join(out))
          PY
          grep -c "dns-libs" conanfile.py || echo "dns-libs removed"

      # Every AdGuard-namespaced dependency lives in one place: NativeLibsCommon
      # carries the recipes for its own patched dependencies under conan/recipes.
      # So this is one clone and a loop, not a hunt through seven repositories.
      #
      # Versions are read from the client's own requirements rather than listed
      # here, so bumping the client cannot silently export the wrong ones.
      - name: Export AdGuard recipes
        run: |
          set -eu
          git clone --quiet --depth 1 --branch v8.1.49 \
            https://github.com/AdguardTeam/NativeLibsCommon /tmp/nlc
          conan export /tmp/nlc --version 8.1.49 --user adguard --channel oss

          python3 - <<'PY' > /tmp/wanted.txt
          import io, re
          wanted = {}
          for f in ["client/conanfile.py", "/tmp/nlc/conanfile.py"]:
              try:
                  d = io.open(f, encoding="utf-8").read()
              except OSError:
                  continue
              for name, ver in re.findall(r'"([a-z0-9_.-]+)/([^@"]+)@adguard/oss"', d):
                  wanted.setdefault(name, ver)
          for name, ver in sorted(wanted.items()):
              print(name, ver)
          PY
          echo "=== wanted from adguard ==="; sed 's/^/  /' /tmp/wanted.txt

          while read -r name ver; do
            [ -z "${name:-}" ] && continue
            [ "$name" = "native_libs_common" ] && continue
            # A recipe directory is not always named after the package it
            # produces: conan/recipes/boringssl declares name="openssl",
            # version="boring-2024-09-13". So find the directory whose recipe
            # actually declares this name and version, and fall back to the
            # directory named after the package.
            dir=""
            for cand in /tmp/nlc/conan/recipes/*/; do
              [ -f "$cand/conanfile.py" ] || continue
              if grep -q "name = \"$name\"" "$cand/conanfile.py" 2>/dev/null                  && grep -q "version = \"$ver\"" "$cand/conanfile.py" 2>/dev/null; then
                dir="${cand%/}"; break
              fi
            done
            if [ -z "$dir" ]; then
              for cand in "/tmp/nlc/conan/recipes/$name-$ver" "/tmp/nlc/conan/recipes/$name"; do
                if [ -f "$cand/conanfile.py" ]; then dir="$cand"; break; fi
              done
            fi
            if [ -z "$dir" ]; then
              echo "  $name/$ver: NO RECIPE in NativeLibsCommon"
              continue
            fi

            # A recipe that hardcodes its version rejects --version, so only
            # pass it when the recipe does not set one itself.
            if grep -qE "^\s*version\s*=" "$dir/conanfile.py" 2>/dev/null; then
              out=$(conan export "$dir" --user adguard --channel oss 2>&1) && ok=1 || ok=0
            else
              out=$(conan export "$dir" --version "$ver" --user adguard --channel oss 2>&1) && ok=1 || ok=0
            fi
            if [ "$ok" = "1" ]; then
              echo "  $name/$ver: exported from $(basename "$dir")"
            else
              echo "  $name/$ver: export FAILED from $(basename "$dir")"
              echo "$out" | tail -3 | sed 's/^/      /'
            fi
          done < /tmp/wanted.txt

      # continue-on-error makes GitHub report this step as "success" even when it
      # failed - that read as progress once and was not. The summary below is the
      # honest signal; this only keeps the run alive long enough to print it.
      - name: Resolve dependencies
        working-directory: client
        continue-on-error: true
        run: |
          conan install . -pr:h target -pr:b default --build=missing -of /tmp/out 2>&1 | tee /tmp/resolve.log

      # The native library links trusttunnel_deeplink_ffi, a Rust staticlib, so
      # the Android build needs a Rust toolchain with the Android target as well
      # as the NDK.
      - name: Rust for Android
        if: startsWith(inputs.target, 'android')
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          rustc --version
      # Gradle runs the CMake bundled with the SDK, which is 3.22.1, while the
      # project's root CMakeLists asks for 3.24. Install a newer one and point
      # the build at it explicitly rather than hoping AGP picks it.
      - name: A CMake new enough for the project
        if: startsWith(inputs.target, 'android')
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6" >/dev/null 2>&1 || true
          ls "$ANDROID_HOME/cmake" | sed "s/^/  available: /"
          echo "cmake.dir=$ANDROID_HOME/cmake/3.31.6" >> client/platform/android/local.properties
          cat client/platform/android/local.properties

      # Note: this builds every ABI the project defines. Restricting it to the
      # one we ship is a size optimisation, and belongs after the build is
      # known to work at all - not in the run that is still asking whether it
      # does.

      # The actual thing the app needs. Allowed to fail: this is still a probe,
      # and where it stops is the answer.
      - name: Build the AAR
        if: startsWith(inputs.target, 'android')
        continue-on-error: true
        working-directory: client/platform/android
        run: |
          ./gradlew :lib:assembleRelease --no-daemon 2>&1 | tail -200

      - name: Did an AAR come out?
        if: startsWith(inputs.target, 'android')
        run: |
          find client/platform/android -name "*.aar" -exec ls -lh {} + 2>/dev/null || echo "  no AAR produced"

      - name: What we learned
        run: |
          echo "=== target: ${{ inputs.target }} ==="
          echo "=== first failure ==="
          grep -E "^ERROR" /tmp/resolve.log | head -3 | sed 's/^/  /' || echo "  none - resolution got through"
          echo "=== still unresolvable from adguard ==="
          grep -oE "[a-z0-9_.-]+/[^@ ]+@adguard/oss" /tmp/resolve.log | sort -u | sed 's/^/  /' || echo "  none"
          echo "=== how much got built ==="
          echo "  building from source: $(grep -c 'Building from source' /tmp/resolve.log || true)"
          echo "  downloaded:           $(grep -c 'Downloaded' /tmp/resolve.log || true)"
