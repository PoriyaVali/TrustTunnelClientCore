name: probe-build

# Work out what it takes to build the client core, on a runner that can reach
# the package index.
#
# conancenter answers 403 from our own network, so a local build cannot resolve
# even brotli - a network fact rather than anything about this project. The same
# was true of the endpoint: Windows could not compile it, and CI became the
# compiler.
#
# The target is a parameter. Android is what the app needs first, but the client
# supports Windows too and none of this should have to be rewritten to get
# there - only a profile added below.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which platform to resolve for'
        type: choice
        options: [android-arm64, android-arm32, windows-x64, linux-x64]
        default: android-arm64
      client_ref:
        description: 'Ref of PoriyaVali/TrustTunnelClient'
        default: 'master'
      drop_dns_libs:
        description: 'Remove dns-libs. Owner decided to KEEP it: DNS handling matters too much in Iran to trade for size'
        type: boolean
        default: false
      abis:
        description: 'Android ABIs to build. Upstream builds all four; we ship two'
        default: 'arm64-v8a,armeabi-v7a'

jobs:
  probe:
    runs-on: ${{ inputs.target == 'windows-x64' && 'windows-latest' || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      # This repository too: the scripts the workflow runs live here, and
      # checking out only the client left them missing on the runner.
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out the client
        uses: actions/checkout@v4
        with:
          repository: PoriyaVali/TrustTunnelClient
          ref: ${{ inputs.client_ref }}
          path: client
          # Full history, for the tags. The library version comes from
          # `git describe --tags`, and a shallow clone has none - which is why
          # the first AAR built as 0.0.0-git. An artefact we intend to publish
          # and pin needs to say what it is.
          fetch-depth: 0

      - name: Tools
        run: |
          python3 -m pip install --quiet "conan>=2.0"
          conan --version
          conan profile detect --force

      # Upstream publishes its conan profiles - including the cross-compilation
      # toolchains - as a plain release asset, so none of this has to be written.
      - name: AdGuard's conan profiles
        run: |
          curl -sL -o /tmp/conanfiles.tar.gz \
            https://github.com/AdguardTeam/NativeLibsCommon/releases/latest/download/conanfiles.tar.gz
          mkdir -p /tmp/cf && tar -xzf /tmp/conanfiles.tar.gz -C /tmp/cf
          CH="$(conan config home)"
          cp /tmp/cf/profiles/* "$CH/profiles/"
          cp /tmp/cf/settings_user.yml "$CH/" 2>/dev/null || true
          ls "$CH/profiles" | tr '\n' ' '; echo

      # One case per target. Adding a platform later means adding a case here,
      # and nothing else.
      - name: Profile for ${{ inputs.target }}
        run: |
          CH="$(conan config home)"
          case "${{ inputs.target }}" in
            android-arm64|android-arm32)
              if [ "${{ inputs.target }}" = "android-arm64" ]; then a=armv8; else a=armv7; fi
              cat > "$CH/profiles/target" <<EOF
          include(android.jinja)
          [settings]
          os=Android
          os.api_level=26
          arch=$a
          compiler=clang
          compiler.version=18
          compiler.libcxx=c++_static
          compiler.cppstd=20
          build_type=Release
          [conf]
          tools.android:ndk_path=${ANDROID_NDK_LATEST_HOME}
          EOF
              ;;
            windows-x64)
              cat > "$CH/profiles/target" <<'EOF'
          include(windows-msvc.jinja)
          [settings]
          os=Windows
          arch=x86_64
          compiler=msvc
          compiler.version=194
          compiler.runtime=static
          compiler.cppstd=20
          build_type=Release
          EOF
              ;;
            linux-x64)
              cat > "$CH/profiles/target" <<'EOF'
          include(linux.jinja)
          [settings]
          os=Linux
          arch=x86_64
          compiler=gcc
          compiler.version=13
          compiler.libcxx=libstdc++11
          compiler.cppstd=20
          build_type=Release
          EOF
              ;;
          esac
          conan profile show -pr target | head -18

      # In our configuration the DNS proxy is never constructed: dns_handler
      # returns early when dns_upstreams is empty, and Irboard does not emit
      # deep-link tag 0x0D. Dropping the heaviest dependency changes size, not
      # behaviour.
      # A script in this repo rather than Python nested inside YAML inside a
      # heredoc - that shape broke this workflow twice on escape handling.
      - name: Drop dns-libs
        if: ${{ inputs.drop_dns_libs }}
        run: python3 scripts/drop_dns_libs.py client

      # Every AdGuard-namespaced dependency lives in one place: NativeLibsCommon
      # carries the recipes for its own patched dependencies under conan/recipes.
      # So this is one clone and a loop, not a hunt through seven repositories.
      #
      # Versions are read from the client's own requirements rather than listed
      # here, so bumping the client cannot silently export the wrong ones.
      - name: Export AdGuard recipes
        run: |
          set -eu
          git clone --quiet --depth 1 --branch v8.1.49 \
            https://github.com/AdguardTeam/NativeLibsCommon /tmp/nlc
          conan export /tmp/nlc --version 8.1.49 --user adguard --channel oss

          # DnsLibs at the exact commit the client asks for, not at the tag.
          # The client wants dns-libs/2.10.1-1-g7748c6a7 - one commit after
          # v2.10.1 - and that commit is precisely the one that bumps
          # native_libs_common from 8.1.48 to 8.1.49. Exporting from the tag
          # produced a version conflict that does not exist upstream.
          git clone --quiet --filter=blob:none https://github.com/AdguardTeam/DnsLibs /tmp/dnslibs
          git -C /tmp/dnslibs checkout --quiet 7748c6a7
          echo "  DnsLibs pins: $(grep -o 'native_libs_common/[0-9.]*' /tmp/dnslibs/conanfile.py | head -1)"
          conan export /tmp/dnslibs --version 2.10.1-1-g7748c6a7 --user adguard --channel oss


          # Export every recipe rather than the ones named in a conanfile.
          # Chasing them one at a time missed transitive ones - bringing
          # dns-libs back pulled in libsodium, which no scan of the client had
          # any reason to mention. Exporting is only registering a recipe, not
          # building it, so the unused ones cost nothing.
          for dir in /tmp/nlc/conan/recipes/*/; do
            [ -f "$dir/conanfile.py" ] || continue
            name=$(basename "$dir")
            if grep -qE "^[[:space:]]*version[[:space:]]*=" "$dir/conanfile.py"; then
              if conan export "$dir" --user adguard --channel oss >/dev/null 2>&1; then
                echo "  $name: exported"
              else
                echo "  $name: export failed"
              fi
            else
              echo "  $name: skipped (no version in recipe)"
            fi
          done
          echo "=== recipes now in the cache ==="
          conan list "*" 2>/dev/null | grep -E "^[a-z]" | head -30 | sed "s/^/  /" || true  # || true: under set -e + pipefail, head closing the pipe kills the step

      # continue-on-error makes GitHub report this step as "success" even when it
      # failed - that read as progress once and was not. The summary below is the
      # honest signal; this only keeps the run alive long enough to print it.
      - name: Resolve dependencies
        working-directory: client
        continue-on-error: true
        run: |
          conan install . -pr:h target -pr:b default --build=missing -of /tmp/out 2>&1 | tee /tmp/resolve.log

      # The native library links trusttunnel_deeplink_ffi, a Rust staticlib, so
      # the Android build needs a Rust toolchain with the Android target as well
      # as the NDK.
      - name: Rust for Android
        if: startsWith(inputs.target, 'android')
        run: |
          set -eu
          # The client pins its own toolchain (rust-toolchain.toml at its root),
          # and `rustup target add` only ever touches the ACTIVE toolchain. The
          # targets went to the runner's default, the pinned one was installed
          # fresh by cargo with no Android std, and the build died at the first
          # Rust crate with "error[E0463]: can't find crate for `std`".
          #
          # Read the channel rather than naming it, so a client bump cannot
          # silently go back to equipping the wrong toolchain.
          CHANNEL=$(grep channel client/rust-toolchain.toml | cut -d'"' -f2)
          echo "  the client pins: $CHANNEL"
          # Derive the Rust targets from the ABI list rather than listing them
          # twice. The two drifting apart is exactly how the x86 failure
          # happened: the ABI was built, its target was never installed.
          TARGETS=""
          for abi in $(echo "${{ inputs.abis }}" | tr ',' ' '); do
            case "$abi" in
              arm64-v8a)   t=aarch64-linux-android ;;
              armeabi-v7a) t=armv7-linux-androideabi ;;
              x86_64)      t=x86_64-linux-android ;;
              x86)         t=i686-linux-android ;;
              *) echo "  unknown ABI: $abi"; exit 1 ;;
            esac
            echo "  $abi -> $t"
            TARGETS="$TARGETS --target $t"
          done
          rustup toolchain install "$CHANNEL" --profile minimal $TARGETS
          # The build invokes `cargo ndk`, not plain cargo: cargo-ndk is what
          # sets the Android linker and sysroot for each target. Adding the
          # rustup targets alone is not enough - the command itself is missing.
          cargo install cargo-ndk --locked
          cargo ndk --version
          # From inside the client, so the pin applies and this shows what the
          # build will actually use.
          cd client && rustup show
      # Gradle runs the CMake bundled with the SDK, which is 3.22.1, while the
      # project's root CMakeLists asks for 3.24. Install a newer one and point
      # the build at it explicitly rather than hoping AGP picks it.
      - name: A CMake new enough for the project
        if: startsWith(inputs.target, 'android')
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6" >/dev/null 2>&1 || true
          ls "$ANDROID_HOME/cmake" | sed "s/^/  available: /"
          echo "cmake.dir=$ANDROID_HOME/cmake/3.31.6" >> client/platform/android/local.properties
          cat client/platform/android/local.properties

      # This turned out to be more than a size optimisation. Upstream sets no
      # abiFilters, so AGP builds all four ABIs, and the run that finally got
      # arm64 through then failed on x86 - which no device in our fleet uses,
      # and whose Rust target we deliberately did not install.
      - name: Only the ABIs we ship
        if: startsWith(inputs.target, 'android')
        run: python3 scripts/select_abis.py client "${{ inputs.abis }}"

      # The actual thing the app needs. This built successfully on
      # b9a2c54, so it is no longer a probe that is allowed to fail:
      # continue-on-error would now hide a regression behind a green run, and
      # it already did that once.
      - name: Build the AAR
        if: startsWith(inputs.target, 'android')
        working-directory: client/platform/android
        run: |
          # Keep the whole build log and pull the errors out of it. Tailing it
          # hid the CMake error twice - at 60 lines and again at 200 - because
          # the configure output that precedes it is long.
          ./gradlew :lib:assembleRelease --no-daemon > /tmp/gradle.log 2>&1 || true
          echo "=== errors ==="
          # Two lessons in one line. "error:" does not match "error[E0463]:", so
          # the only real error in the last run was filtered out of its own error
          # report - hence the "error[[]" alternative, a bracket expression rather
          # than an escape. And matching CMake's (dev) warnings filled all 80
          # lines with harmless policy notices, which is the same failure as
          # tailing the log: the signal was there and something else was printed.
          grep -nE "CMake Error|error:|error[[]|FAILED:|ninja: build stopped|What went wrong" -A 8 /tmp/gradle.log | head -80 || echo "  none matched"
          echo "=== last 40 lines ==="
          tail -40 /tmp/gradle.log

      # An AAR that only ever existed on a runner is not a deliverable. The
      # first successful build produced one and it was gone the moment the job
      # ended.
      - name: Inspect the AAR
        if: startsWith(inputs.target, 'android')
        run: |
          AAR=$(find client/platform/android -name "*.aar" | head -1)
          if [ -z "$AAR" ]; then echo "  no AAR produced"; exit 1; fi
          ls -lh "$AAR"
          echo "=== native libraries inside ==="
          # The point of the build. An AAR with no .so in it would still be a
          # valid AAR, and would fail at runtime instead of here.
          unzip -l "$AAR" | grep "\.so$" || { echo "  NO .so IN THE AAR"; exit 1; }
          echo "=== every ABI present ==="
          unzip -l "$AAR" | grep -oE "jni/[a-z0-9_-]+" | sort -u

      - name: Keep the AAR
        if: startsWith(inputs.target, 'android')
        uses: actions/upload-artifact@v4
        with:
          name: trusttunnel-client-${{ inputs.target }}
          path: client/platform/android/lib/build/outputs/aar/*.aar
          if-no-files-found: error

      - name: What we learned
        run: |
          echo "=== target: ${{ inputs.target }} ==="
          echo "=== first failure ==="
          grep -E "^ERROR" /tmp/resolve.log | head -3 | sed 's/^/  /' || echo "  none - resolution got through"
          echo "=== still unresolvable from adguard ==="
          grep -oE "[a-z0-9_.-]+/[^@ ]+@adguard/oss" /tmp/resolve.log | sort -u | sed 's/^/  /' || echo "  none"
          echo "=== how much got built ==="
          echo "  building from source: $(grep -c 'Building from source' /tmp/resolve.log || true)"
          echo "  downloaded:           $(grep -c 'Downloaded' /tmp/resolve.log || true)"
